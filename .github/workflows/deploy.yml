# Push vào main → kiểm tra + test → migrations → deploy staging.
# Cần GitHub Secrets: CLOUDFLARE_API_TOKEN (quyền D1 Edit + Workers Scripts Edit + Workers R2 Storage Edit), CLOUDFLARE_ACCOUNT_ID.
# Production chưa bật: env production trong wrangler.jsonc đang dùng chung database_id với staging.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Lỗi code thì dừng ở đây, chưa động vào database hay Worker đang chạy.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ecm/web build

      - name: Migrations (staging)
        working-directory: workers
        run: npx wrangler d1 migrations apply DB --remote --env staging

      - name: Deploy staging
        working-directory: workers
        run: npx wrangler deploy --env staging

      - name: Tóm tắt
        run: |
          {
            echo "### Đã deploy staging"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- https://ecm-api-staging.khovattu.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
