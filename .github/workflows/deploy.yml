# Tự động deploy lên Cloudflare khi push vào main (staging) hoặc tag v* (production).
# Cần GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Chờ CI pass trước khi deploy
    needs: []
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build web trước (assets được Workers phục vụ)
      - name: Build web
        run: pnpm --filter @ecm/web build

      # Chạy migration nếu có thay đổi schema
      - name: Chạy migrations (staging)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: workers
        run: npx wrangler d1 migrations apply DB --remote --env staging

      - name: Chạy migrations (production)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: workers
        run: npx wrangler d1 migrations apply DB --remote --env production

      # Deploy Workers + web assets
      - name: Deploy staging
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: workers
        run: npx wrangler deploy --env staging

      - name: Deploy production
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: workers
        run: npx wrangler deploy --env production

      - name: Tóm tắt
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ENV="production"
          else
            ENV="staging"
          fi
          echo "### Đã deploy $ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Thời gian: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
