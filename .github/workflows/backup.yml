# Sao lưu D1 hằng ngày sang R2 (bucket ecm-backups). Kích hoạt sau khi cấu hình GitHub Secrets:
#   CLOUDFLARE_API_TOKEN (quyền D1 Read + R2 Edit), CLOUDFLARE_ACCOUNT_ID
name: D1 backup
on:
  schedule:
    - cron: '0 19 * * *' # 02:00 giờ Việt Nam
  workflow_dispatch:

jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export D1
        working-directory: workers
        run: |
          STAMP=$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d-%H%M)
          npx wrangler d1 export DB --remote --env production --output "../ecm-db-$STAMP.sql"
          gzip "../ecm-db-$STAMP.sql"
          npx wrangler r2 object put "ecm-backups/d1/ecm-db-$STAMP.sql.gz" --file "../ecm-db-$STAMP.sql.gz" --remote
