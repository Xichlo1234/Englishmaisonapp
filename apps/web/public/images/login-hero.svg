<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="Minh họa lớp học tiếng Anh">
  <defs>
    <linearGradient id="g-board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183d46"/><stop offset="1" stop-color="#1f4f58"/>
    </linearGradient>
    <linearGradient id="g-book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcede7"/>
    </linearGradient>
  </defs>
  <!-- bảng -->
  <rect x="60" y="40" width="300" height="190" rx="14" fill="url(#g-board)" stroke="#bfe0d7" stroke-width="6"/>
  <text x="90" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Hello!</text>
  <text x="90" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#8cc5b9">Xin chào các em</text>
  <text x="90" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#fde68a">A  B  C  →  a  b  c</text>
  <path d="M250 205 q30 -18 60 0" stroke="#86efac" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="180" y="230" width="60" height="10" rx="3" fill="#bfe0d7"/>
  <!-- bóng thoại -->
  <g transform="translate(372 60)">
    <rect width="120" height="64" rx="16" fill="#ffffff"/>
    <path d="M18 64 l-6 22 l26 -22z" fill="#ffffff"/>
    <text x="60" y="41" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#167c75">Good job!</text>
  </g>
  <g transform="translate(392 160)">
    <rect width="96" height="52" rx="14" fill="#dcfce7"/>
    <path d="M70 52 l8 18 l-26 -18z" fill="#dcfce7"/>
    <text x="48" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d">A+ ★</text>
  </g>
  <!-- sách mở -->
  <g transform="translate(150 280)">
    <path d="M0 20 q90 -30 110 10 v110 q-20 -40 -110 -10z" fill="url(#g-book)" stroke="#8cc5b9" stroke-width="3"/>
    <path d="M220 20 q-90 -30 -110 10 v110 q20 -40 110 -10z" fill="url(#g-book)" stroke="#8cc5b9" stroke-width="3"/>
    <g fill="none" stroke="#8cc5b9" stroke-width="3" stroke-linecap="round">
      <path d="M22 45 q35 -12 70 4"/><path d="M22 68 q35 -12 70 4"/><path d="M22 91 q35 -12 70 4"/>
      <path d="M128 49 q35 -16 70 -4"/><path d="M128 72 q35 -16 70 -4"/><path d="M128 95 q35 -16 70 -4"/>
    </g>
  </g>
  <!-- khối chữ -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="30" text-anchor="middle">
    <g transform="translate(36 330) rotate(-8)"><rect width="56" height="56" rx="10" fill="#fde68a"/><text x="28" y="39" fill="#b45309">A</text></g>
    <g transform="translate(70 380) rotate(6)"><rect width="50" height="50" rx="10" fill="#bbf7d0"/><text x="25" y="35" fill="#15803d">B</text></g>
    <g transform="translate(400 330) rotate(8)"><rect width="56" height="56" rx="10" fill="#fecdd3"/><text x="28" y="39" fill="#be123c">C</text></g>
  </g>
  <!-- bút chì -->
  <g transform="translate(410 400) rotate(-35)">
    <rect width="90" height="16" rx="3" fill="#facc15"/><rect x="90" width="14" height="16" fill="#fca5a5"/>
    <path d="M0 0 l-18 8 l18 8z" fill="#fde68a"/><path d="M-12 5 l-6 3 l6 3z" fill="#334155"/>
  </g>
  <!-- ngôi sao -->
  <g fill="#fde047">
    <path d="M30 70 l5 11 l12 1 l-9 8 l3 12 l-11 -6 l-11 6 l3 -12 l-9 -8 l12 -1z"/>
    <path d="M480 260 l4 8 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -1z"/>
  </g>
  <circle cx="20" cy="200" r="6" fill="#8cc5b9"/><circle cx="500" cy="40" r="8" fill="#8cc5b9"/>
</svg>
